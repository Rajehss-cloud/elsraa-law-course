<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول | Al-Israa Law Center</title>
    <meta name="description" content="تسجيل الدخول إلى منصة مركز الإسراء التعليمية." />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@200;300;400;500;600;700;800;900&family=Cinzel:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="theme-dark auth-page">
    <div class="auth-shell container">
      <div class="auth-card glass-card">
        <div class="auth-brand">
          <img src="assets/logo.svg" alt="logo" class="brand-logo" />
          <div>
            <h1>مركز الإسراء</h1>
            <p>منصة التعليم القانوني</p>
          </div>
        </div>

        <h2>تسجيل الدخول</h2>

        <form id="loginForm" class="auth-form">
          <div class="field-group">
            <label for="loginEmail">البريد الإلكتروني</label>
            <input id="loginEmail" type="email" placeholder="your@email.com" required />
          </div>
          <div class="field-group">
            <label for="loginPassword">كلمة المرور</label>
            <input id="loginPassword" type="password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">تسجيل الدخول</button>
        </form>

        <div class="auth-footer">
          <a href="forgot-password.html">نسيت كلمة المرور؟</a>
          <span>ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></span>
        </div>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
